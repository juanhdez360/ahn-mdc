[project]
name = "ahn-experiment"
version = "0.2.0"
description = "Characterizing information degradation and confidence calibration in AHN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jupyter>=1.1",
    "notebook>=7.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "torch>=2.11",
    "transformers==4.51.0",
]

# The analysis half runs on a laptop. Only the run notebook needs these.
[project.optional-dependencies]
models = [
    "accelerate>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ahnexp"]

# Stop LLaMA-Factory (and friends) from silently downgrading to 4.49.
[tool.uv]
override-dependencies = ["transformers==4.51.0"]
